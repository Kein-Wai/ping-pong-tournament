name: iOS Build & Upload to App Store Connect

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-deploy:
    name: Build & Deploy iOS App
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: 🔐 Instalar Certificados de Firma (Code Signing)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          # 1. Definir rutas
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # 2. Descodificar Base64 binario
          echo "$BUILD_CERTIFICATE_BASE64" | openssl base64 -d -A -out $CERTIFICATE_PATH
          echo "$BUILD_PROVISION_PROFILE_BASE64" | openssl base64 -d -A -out $PP_PATH

          # 3. Crear Llavero Temporal
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 4. Importar certificado
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security list-keychains -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 5. Extraer UUID y Bundle ID directamente del Provisioning Profile
          PROFILE_UUID=$(security cms -D -i $PP_PATH | plutil -extract UUID raw -)
          APP_ID=$(security cms -D -i $PP_PATH | plutil -extract Entitlements.application-identifier raw -)
          BUNDLE_ID=${APP_ID#*.}

          # 6. Guardar en variables globales de GitHub Actions
          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV

          # 7. Registrar perfil
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision

      - name: 📦 Instalar dependencias web
        run: npm install

      - name: 🏗️ Compilar Frontend (Vite)
        run: npm run build

      - name: 🔄 Sincronizar Capacitor (SPM)
        run: npx cap sync ios

      - name: 🛠️ Compilar Archivo de Producción (Archive)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
            archive

      - name: 📱 Exportar .IPA firmado
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios/App

          # Generar el ExportOptions.plist con la clave provisioningProfiles requerida
          cat <<EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROVISIONING_PROFILE_UUID</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/output

      - name: 💾 Guardar .IPA en GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PingPongClub-IPA
          path: ${{ runner.temp }}/output/*.ipa

      - name: 🚀 Subir a App Store Connect (TestFlight)
        env:
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          P8_BASE64: ${{ secrets.APPSTORE_P8_BASE64 }}
        run: |
          # Preparar archivo AuthKey (.p8)
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$P8_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

          # Buscar el archivo .ipa exportado
          IPA_PATH=$(find $RUNNER_TEMP/output -name "*.ipa")

          # Subir con altool
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
