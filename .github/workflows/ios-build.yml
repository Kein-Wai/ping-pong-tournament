name: iOS Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: 📦 Instalar dependencias
        run: npm install

      - name: 🏗️ Compilar Frontend (Vite)
        run: npm run build

      - name: 🔄 Sincronizar Capacitor (SPM)
        run: npx cap sync ios

      - name: 🛠️ Compilar App de iOS (Modo Simulador/Test)
        run: |
          cd ios/App
          # 👈 CAMBIO CLAVE: Usamos -project App.xcodeproj porque ya no hay Workspace ni Podfile
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 15' build
