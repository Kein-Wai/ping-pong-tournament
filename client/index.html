<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>TT Tournament App</title>
    <style>
      /* =========================================
         1. COMPARTIDO (Escritorio y Móvil)
         ========================================= */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      #root {
        /* En el PC esto será 0px. En el iPhone empujará el menú hacia abajo */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        min-height: 100vh;
        box-sizing: border-box;
      }

      /* =========================================
         2. SOLO PANTALLAS TÁCTILES (Móviles)
         ========================================= */
      @media (pointer: coarse) {
        html,
        body {
          overscroll-behavior-y: none;
          touch-action: manipulation;
          -webkit-user-select: none;
          user-select: none;
          -webkit-tap-highlight-color: transparent;
        }

        /* Los inputs siempre deben ser seleccionables para escribir */
        input,
        textarea {
          -webkit-user-select: auto;
          user-select: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
